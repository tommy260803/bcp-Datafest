[project]
name = "bcp-datafest"
version = "0.1.0"
description = "Validación temporal y entrega reproducible BCP–ESAN"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.3,<3", "scikit-learn>=1.7,<1.8",
  "catboost>=1.2.8,<1.3", "lightgbm>=4.6,<5", "optuna>=4.5,<5",
  "joblib>=1.5,<2", "psutil>=7,<8", "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

